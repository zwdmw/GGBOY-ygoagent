[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-striker-expert"
version = "0.1.0"
description = "Versioned Sky Striker JAX policy, PPO training and YGOPro TCP client"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.13.1", "jax==0.4.28", "jaxlib==0.4.28",
  "flax==0.8.4", "chex==0.1.86", "optax==0.2.2", "orbax-checkpoint==0.5.16",
  "tensorstore==0.1.63", "gymnasium==0.29.1", "gym==0.26.2", "dm-env==1.6",
  "optree==0.11.0", "packaging>=24.1", "distrax==0.1.5",
  "tensorflow-probability==0.24.0", "rich==13.7.1", "ml-dtypes==0.4.0"
]

[project.optional-dependencies]
runtime = []
train = ["tyro==0.8.5", "tensorboardX==2.6.2.2", "pandas==2.2.2", "tqdm==4.66.4"]
cuda = [
  "tyro==0.8.5", "tensorboardX==2.6.2.2", "pandas==2.2.2", "tqdm==4.66.4",
  "jax[cuda12]==0.4.28", "nvidia-cublas-cu12==12.1.3.1", "nvidia-cuda-cupti-cu12==12.1.105",
  "nvidia-cuda-nvcc-cu12==12.1.105", "nvidia-cuda-runtime-cu12==12.1.105",
  "nvidia-cudnn-cu12==8.9.2.26", "nvidia-cufft-cu12==11.0.2.54",
  "nvidia-cusolver-cu12==11.4.5.107", "nvidia-cusparse-cu12==12.1.0.106",
  "nvidia-nccl-cu12==2.18.1", "nvidia-nvjitlink-cu12==12.1.105"
]

[project.scripts]
ygo-sky = "ygo_sky.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md", "third_party/ygo-agent/YGO-AGENT-LICENSE.txt", "third_party/ygo-agent/APACHE-2.0.txt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ygo_sky*", "ygoai*"]
exclude = ["ygoai.rl.jax.nnx*"]
namespaces = true

[tool.setuptools.package-data]
"ygo_sky.duel.network" = ["native_contract.json"]

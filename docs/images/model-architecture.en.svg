<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="935" viewBox="0 0 1200 935" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Model architecture · decision-v1</title><desc id="desc">Structured observations → recurrent memory → legal action scores</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; fill: #172b43; }
    .title { font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
    .subtitle { font-size: 18px; fill: #54657a; }
    .heading { font-size: 22px; font-weight: 650; }
    .body { font-size: 18px; }
    .small { font-size: 16px; fill: #54657a; }
    .label { font-size: 15px; font-weight: 700; fill: #54657a; letter-spacing: 1px; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 16px; fill: #34516a; }
    .step { font-size: 18px; font-weight: 700; fill: #0f766e; }
  </style>
</defs>
<rect width="1200" height="935" rx="24" fill="#f6f8fc"/>
<rect x="36" y="35" width="5" height="32" rx="2" fill="#0f766e"/>

<text x="56" y="61" class="title">Model architecture · decision-v1</text>
<text x="56" y="96" class="subtitle">Structured observations → recurrent memory → legal action scores</text>
<text x="36" y="136" class="label">01  INPUTS</text>
<text x="326" y="136" class="label">02  ENCODING</text>
<text x="676" y="136" class="label">03  MEMORY &amp; HEADS</text>
<text x="972" y="136" class="label">04  OUTPUTS</text>
<g>
<rect x="36" y="156" width="240" height="185" rx="16" fill="#edf3fe" stroke="#b9cbee" stroke-width="1.5"/>
<text x="56" y="191" class="heading">Cards + semantics</text>
<text x="56" y="225" class="small">cards_: 160 × 41</text>
<text x="56" y="254" class="small">Zones / controller / state</text>
<text x="56" y="283" class="small">CDB + Lua effect features</text>
<text x="56" y="312" class="small">Fixed tables; learned encoder</text>
</g>
<g>
<rect x="36" y="371" width="240" height="119" rx="16" fill="#ffffff" stroke="#dbe3ed" stroke-width="1.5"/>
<text x="56" y="406" class="heading">Global + selection</text>
<text x="56" y="440" class="small">LP / turn / phase / counts</text>
<text x="56" y="469" class="small">global_: 23 · selection_: 12</text>
</g>
<g>
<rect x="36" y="520" width="240" height="146" rx="16" fill="#ffffff" stroke="#dbe3ed" stroke-width="1.5"/>
<text x="56" y="555" class="heading">Public events</text>
<text x="56" y="589" class="small">32 events + card references</text>
<text x="56" y="618" class="small">public_events_: 32 × 16</text>
<text x="56" y="647" class="small">Position encoding + attention</text>
</g>
<g>
<rect x="36" y="686" width="240" height="139" rx="16" fill="#ffffff" stroke="#dbe3ed" stroke-width="1.5"/>
<text x="56" y="721" class="heading">Candidates + roles</text>
<text x="56" y="755" class="small">action_ir_: 128 × 24</text>
<text x="56" y="784" class="small">Source / target / groups</text>
<text x="56" y="813" class="small">Legal slots + padding mask</text>
</g>
<rect x="326" y="156" width="300" height="656" rx="16" fill="#fff" stroke="#a3d8ce" stroke-width="1.5"/>
<text x="346" y="193" class="heading">StructuredEncoder</text>
<text x="346" y="224" class="small">Shared feature width: 128</text>
<rect x="346" y="251" width="260" height="150" rx="12" fill="#e9f7f4" stroke="#e9f7f4" stroke-width="1.5"/>
<text x="362" y="284" class="heading">Scene attention</text>
<text x="362" y="316" class="small">Cards + global + events</text>
<text x="362" y="344" class="small">2 Transformer layers · 4 heads</text>
<text x="362" y="372" class="small">Contextual scene features</text>
<rect x="346" y="425" width="260" height="164" rx="12" fill="#edf3fe" stroke="#edf3fe" stroke-width="1.5"/>
<text x="362" y="459" class="heading">Candidate encoding</text>
<text x="362" y="492" class="small">Bind source / target roles</text>
<text x="362" y="518" class="small">1 action → scene cross layer</text>
<text x="362" y="544" class="small">1 candidate self-attention layer</text>
<text x="362" y="570" class="small">Compare options in a prompt</text>
<text x="346" y="641" class="heading">Three encoder outputs</text>
<text x="346" y="676" class="small">State vector → LSTM</text>
<text x="346" y="706" class="small">Action features → FiLMActor</text>
<text x="346" y="736" class="small">Scene + roles → DecisionActor</text>
<text x="346" y="766" class="small">State pooling joins scene + actions</text>
<g>
<rect x="676" y="156" width="238" height="145" rx="16" fill="#e9f7f4" stroke="#a3d8ce" stroke-width="1.5"/>
<text x="696" y="191" class="heading">LSTM</text>
<text x="696" y="225" class="small">512-dim recurrent state</text>
<text x="696" y="254" class="small">Memory across decisions</text>
<text x="696" y="283" class="small">Separate state for each duel</text>
</g>
<g>
<rect x="676" y="370" width="238" height="145" rx="16" fill="#edf3fe" stroke="#b9cbee" stroke-width="1.5"/>
<text x="696" y="405" class="heading">FiLMActor</text>
<text x="696" y="439" class="small">Memory conditions actions</text>
<text x="696" y="468" class="small">Base action logits</text>
<text x="696" y="497" class="small">128 features per candidate</text>
</g>
<g>
<rect x="676" y="566" width="238" height="172" rx="16" fill="#f1edfc" stroke="#cbbdeb" stroke-width="1.5"/>
<text x="696" y="601" class="heading">DecisionActor</text>
<text x="696" y="635" class="small">2 residual decision layers</text>
<text x="696" y="664" class="small">Memory + scene + roles</text>
<text x="696" y="693" class="small">Compare; add logit delta</text>
<text x="696" y="722" class="small">Public-outcome auxiliary</text>
</g>
<g>
<rect x="972" y="423" width="192" height="139" rx="16" fill="#e9f7f4" stroke="#a3d8ce" stroke-width="1.5"/>
<text x="992" y="458" class="heading">Policy scores</text>
<text x="992" y="492" class="small">Base logits + delta</text>
<text x="992" y="521" class="small">Mask padded slots</text>
<text x="992" y="550" class="small">Legal action logits</text>
</g>
<g>
<rect x="972" y="610" width="192" height="108" rx="16" fill="#ffffff" stroke="#dbe3ed" stroke-width="1.5"/>
<text x="992" y="645" class="heading">Choose action</text>
<text x="992" y="679" class="small">Training: sample</text>
<text x="992" y="708" class="small">Inference: argmax</text>
</g>
<g>
<rect x="676" y="777" width="238" height="98" rx="16" fill="#fff7e9" stroke="#e9cc93" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="696" y="812" class="heading">Critic · training</text>
<text x="696" y="846" class="small">3 × 128 MLP → V(s)</text>
</g>
<g>
<rect x="972" y="777" width="192" height="98" rx="16" fill="#fff7e9" stroke="#e9cc93" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="992" y="812" class="heading">Auxiliary head</text>
<text x="992" y="846" class="small">Next public-state delta</text>
</g>
